[workspace]
resolver = "3"
members = [
    "crates/covenant-engine",
    "crates/covenant-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/royvardhan/covenant"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
