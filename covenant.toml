[[promise]]
id = "COV-1"
statement = "Selection runs exactly the promises whose paths match the changed files, and every promise when a lockfile changes"
paths = ["crates/covenant-engine/**"]
check = "cargo test -q -p covenant-engine"

[[promise]]
id = "COV-2"
statement = "A check that exits non-zero or times out always produces a BLOCK and a non-zero exit from `covenant check`"
paths = ["crates/**"]
check = "cargo test -q -p covenant-cli"

[[promise]]
id = "EX-1"
statement = "The billing-service example keeps all three of its own promises"
paths = ["examples/billing-service/**"]
check = "cargo run -q -p covenant-cli -- --config examples/billing-service/covenant.toml check --all --report examples/billing-service/covenant-report.json"

[[promise]]
id = "PACK-1"
statement = "Every shipped pack parses, has at least 5 promises, and every promise carries a statement, a why, paths, and a check template"
paths = ["packs/**"]
check = "cargo test -q -p covenant-engine --test packs"
